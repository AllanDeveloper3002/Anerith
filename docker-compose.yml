services:
  app:
    build: .
    image: anerith:latest
    restart: unless-stopped
    init: true
    env_file: .env.production
    volumes:
      - anerith_data:/data
      - anerith_backups:/backups
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  anerith_data:
  anerith_backups:
  caddy_data:
  caddy_config:
